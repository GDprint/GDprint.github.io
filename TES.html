<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Անահիտ Ձայնային Օգնական</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      padding: 20px;
    }
    #status {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h2>Բարի գալուստ GD Print</h2>
  <p id="status">Խոսքը միացված չէ...</p>
  <button id="start">Սկսել զրույցը Անահիտի հետ</button>

  <script>
    const synth = window.speechSynthesis;
    const status = document.getElementById('status');
    const startBtn = document.getElementById('start');

    let recognition;
    let voices = [];

    function speak(text) {
      if (!synth) return;
      const utterance = new SpeechSynthesisUtterance(text);
      const voice = voices.find(v => v.lang === 'hy-AM') || voices.find(v => v.lang.startsWith('en'));
      if (voice) utterance.voice = voice;
      synth.speak(utterance);
    }

    function initializeRecognition() {
      if (!('webkitSpeechRecognition' in window)) {
        alert('Ձեր բրաուզերը չի աջակցում ձայնային ճանաչման ֆունկցիային։');
        return;
      }

      recognition = new webkitSpeechRecognition();
      recognition.lang = 'hy-AM';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => status.textContent = 'Անահիտը լսում է...';
      recognition.onerror = event => console.error('Խոտան:', event.error);
      recognition.onend = () => {
        status.textContent = 'Խոսքը դադարեց։ Վերսկսելու համար սեղմեք նորից։';
      };

      recognition.onresult = function (event) {
        const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
        console.log('Ասվել է:', transcript);
        processCommand(transcript);
      };

      recognition.start();
      speak('Ողջունում եմ Ձեզ, ես Անահիտն եմ՝ Ձեր անձնական օգնականը։ Ինչպե՞ս կարող եմ օգնել։');
    }

    function processCommand(command) {
      const services = {
        'լայնաֆորմատ': 'wide-format.html',
        'պլոտեր': 'plotter.html',
        'այցեքարտ': 'business-cards.html',
        'լուսանկար': 'photo-print.html',
        'ձևաթուղթ': 'forms.html',
        'օրացույց': 'calendar.html',
        'բաժակ': 'mug-print.html',
        'rull up': 'rullup.html',
        'կտավ': 'canvas.html'
      };

      for (const keyword in services) {
        if (command.includes(keyword)) {
          speak(`Դուք ընտրեցիք ${keyword}-ի տպագրությունը։ Բացում եմ համապատասխան էջը։`);
          window.location.href = services[keyword];
          return;
        }
      }

      if (command.includes('աշխատանքային ժամեր')) {
        speak('Տպարանը բաց է երկուշաբթիից շաբաթ ժամը 10։00-ից 19։00։');
      } else if (command.includes('կոնտակտ')) {
        speak('Մեր հեռախոսահամարն է 041 00 00 00, էլեկտրոնային հասցեն՝ info@gdprint.am։');
      } else if (command.includes('պատմիր քեզ մասին') || command.includes('տպարանի մասին')) {
        speak('GD Print տպարանը առաջարկում է լայն տեսականիով բարձրորակ տպագրական ծառայություններ՝ ժամանակին կատարումով և մատչելի գներով։');
      } else if (command.includes('գաղտնիություն')) {
        speak('Մենք հարգում ենք ձեր գաղտնիությունը և չենք տարածում ձեր տվյալները առանց ձեր համաձայնության։');
      } else if (command.includes('հաճախ տրվող հարց')) {
        speak('Օրինակ՝ ինչպե՞ս պատվիրել․ այցելեք մեր կայքը, ընտրեք ծառայությունը և լրացրեք ձևը։');
      } else {
        speak('Խնդրում եմ կրկնեք կամ ձևակերպեք հարցը այլ կերպ։');
      }
    }

    window.speechSynthesis.onvoiceschanged = () => {
      voices = synth.getVoices();
    };

    startBtn.addEventListener('click', initializeRecognition);
  </script>
</body>
</html>
